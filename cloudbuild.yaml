steps:
  - name: "oven/bun:1.3.13"
    id: "install"
    entrypoint: "bun"
    args: ["install", "--frozen-lockfile"]

  - name: "oven/bun:1.3.13"
    id: "build"
    waitFor: ["install"]
    entrypoint: "bun"
    args: ["run", "check:landing"]

  - name: "node:20-slim"
    id: "deploy"
    waitFor: ["build"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        npm install -g firebase-tools@14
        firebase deploy \
          --only hosting:${_FIREBASE_SITE} \
          --project=${PROJECT_ID} \
          --non-interactive

  - name: "curlimages/curl:8.10.1"
    id: "verify-hosting"
    waitFor: ["deploy"]
    entrypoint: "sh"
    args:
      - "-c"
      - |
        set -eu
        test "${PROJECT_ID}" = "clipealo-gpt-amigos-prod"
        code="$$(curl -L --retry 3 --retry-delay 5 --silent --output /dev/null --write-out '%{http_code}' "https://${_FIREBASE_SITE}.web.app/")"
        test "$$code" = "200"

substitutions:
  _FIREBASE_SITE: "clipealo-gpt-amigos-prod"

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true

# La SA del build debe tener firebase.admin en el proyecto de destino para que
# `firebase deploy` use el ADC sin token. Literal porque el campo serviceAccount
# no admite sustituciones personalizadas (gcloud rechaza la key sin uso con
# "not matched in the template").
serviceAccount: 'projects/clipealo-gpt-amigos-prod/serviceAccounts/clipealo-prod-workloads@clipealo-gpt-amigos-prod.iam.gserviceaccount.com'

timeout: "600s"

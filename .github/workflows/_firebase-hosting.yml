name: Firebase Hosting deployment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment that owns the Google Cloud identity.
        required: true
        type: string
      firebase_config:
        description: Firebase CLI configuration file.
        required: true
        type: string
      firebase_project:
        description: Google Cloud project containing the Hosting site.
        required: true
        type: string
      site_url:
        description: Canonical URL used while generating metadata.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: landing-${{ inputs.environment }}-hosting
  cancel-in-progress: true

jobs:
  deploy:
    name: Check and deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check, test, and build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}
        run: npm run check && npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.30.2

      - name: Deploy static site to Firebase Hosting
        run: >-
          firebase deploy
          --only hosting
          --project ${{ inputs.firebase_project }}
          --config ${{ inputs.firebase_config }}
          --non-interactive

      - name: Verify deployed site
        run: curl --fail --location --retry 3 --retry-delay 5 --silent --show-error --output /dev/null "${{ inputs.site_url }}/"

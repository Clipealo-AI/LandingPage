name: Deploy landing production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_firebase-hosting.yml
    with:
      environment: Production
      firebase_config: firebase.json
      firebase_project: clipealo-gpt-amigos-prod
      site_url: https://clipealo-ai.com
